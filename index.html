<!-- Estilos críticos de la pantalla de arranque: van inline para que se vea
     correcta desde el primer frame, antes de que llegue el CSS del bundle. -->
<style>
  #boot {
    position: fixed;
    inset: 0;
    z-index: 200;
    background: #000503;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Share Tech Mono", monospace;
    color: #00ff9c;
    transition: opacity .55s ease, visibility .55s;
  }
  #boot.gone { opacity: 0; visibility: hidden; pointer-events: none; }

  #boot::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
      to bottom,
      rgba(0, 255, 156, .06) 0 1px, transparent 1px 3px
    );
  }

  .boot-box { width: min(430px, 84vw); position: relative; }

  .boot-logo {
    font-family: "Orbitron", "Share Tech Mono", monospace;
    font-weight: 900;
    font-size: clamp(1.2rem, 5.5vw, 1.85rem);
    letter-spacing: 3px;
    text-align: center;
    color: #eafff6;
    text-shadow: 0 0 18px rgba(0, 255, 156, .75), 0 0 48px rgba(0, 255, 156, .35);
    animation: bootGlitch 2.6s infinite;
  }
  .boot-logo span { color: #00ff9c; }

  .boot-sub {
    text-align: center;
    font-size: .72rem;
    letter-spacing: 4px;
    color: #4d6b61;
    margin-top: 10px;
    text-transform: uppercase;
  }

  /* Tres puntos: toda la espera se resuelve aquí, sin logs ni barra. */
  .boot-dots {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-top: 26px;
  }
  .boot-dots i {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #00ff9c;
    box-shadow: 0 0 12px rgba(0, 255, 156, .9);
    animation: bootDot 1.05s ease-in-out infinite;
  }
  .boot-dots i:nth-child(2) { animation-delay: .18s; }
  .boot-dots i:nth-child(3) { animation-delay: .36s; }

  @keyframes bootDot {
    0%, 100% { opacity: .2; transform: translateY(0) scale(.85); }
    40%      { opacity: 1;  transform: translateY(-6px) scale(1); }
  }
  @keyframes bootGlitch {
    0%, 94%, 100% { transform: none; }
    95% { transform: translateX(-2px) skewX(-3deg); }
    97% { transform: translateX(2px) skewX(3deg); }
  }

  @media (prefers-reduced-motion: reduce) {
    .boot-logo { animation: none; }
    .boot-dots i { animation: none; opacity: .8; }
  }
</style>
</head>
<body>

<!-- Fondo: túnel neón + lluvia Matrix (los pinta src/lib/tunnel.js) -->
<canvas id="bg-tunnel" aria-hidden="true"></canvas>

<!-- Pantalla de arranque: React la borra al montar -->
<div id="boot">
  <div class="boot-box">
    <div class="boot-logo">JOHAN_PERICO<span>/&gt;</span></div>
    <div class="boot-sub">cargando</div>
    <div class="boot-dots"><i></i><i></i><i></i></div>
  </div>
</div>

<noscript>
  <div class="noscript">
    Este portafolio necesita JavaScript activado.<br />
    Contacto directo: WhatsApp +57 324 654 7748 · github.com/johanx12
  </div>
</noscript>

<div id="root"></div>

<script>
/* Red de seguridad del arranque. No depende del bundle de React, así que
   sigue funcionando aunque el JS falle o el navegador tenga cacheado un
   index.html viejo que apunta a un bundle que ya no existe. */
(function () {
  function hideBoot() {
    var b = document.getElementById("boot");
    if (!b) return;
    b.classList.add("gone");
    setTimeout(function () { if (b.parentNode) b.remove(); }, 600);
  }

  // 1) Pase lo que pase, a los 1.4s la pantalla de carga se va.
  setTimeout(hideBoot, 1400);

  // 2) Si React no montó nada, el index.html es viejo: recarga una sola vez
  //    saltándose la caché. El guardia en sessionStorage evita el bucle.
  setTimeout(function () {
    var root = document.getElementById("root");
    var vacio = !root || root.children.length === 0;
    try {
      if (vacio && !sessionStorage.getItem("jp_recarga")) {
        sessionStorage.setItem("jp_recarga", "1");
        location.replace(location.pathname + "?r=" + Date.now());
      } else if (!vacio) {
        sessionStorage.removeItem("jp_recarga");
      }
    } catch (e) {
      /* sessionStorage bloqueado: no recargamos, para no arriesgar un bucle */
    }
  }, 2600);
})();
</script>

<script type="module" src="/src/main.jsx"></script>
</body>
